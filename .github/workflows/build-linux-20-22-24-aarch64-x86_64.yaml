name: Build and Test

# Builds and tests GstPipeStudio on Ubuntu 20.04, 22.04 and 24.04, on x86_64 and on aarch64 (also called arm64), from a plain
# Ubuntu with nothing installed. The steps of every job, in this order; a step that fails stops the job:
#   GStreamer Setup    scripts/check_gst.sh          GStreamer 1.16 or newer (installed with apt when missing)
#   Qt Cache, Setup    scripts/check_qt.sh           Qt 6.8.3, built from its source into ~/Qt/6.8.3 (kept in the cache)
#   Build Tools Setup  scripts/check_build_tools.sh  compiler, CMake, Ninja
#   Build, Test        CMake and ctest
#   Install Check      cmake --install into a folder, and look at what a package would hold: the files, the Qt it loads, a start
#   Package            scripts/make_deb.sh           GstPipeStudio-<ubuntu>-<arch>.deb, kept as an artifact of the run
# Then a second job per leg, Install Test, installs that .deb on a plain Ubuntu (nothing of the build is there) and starts it.
# It runs when anything in gstpipestudio/ changes, on pull requests, by hand, and from release.yaml (which gives it the version).
#
# Six jobs start at the same time (3 Ubuntu versions x 2 architectures), each on its own fresh Ubuntu 24.04 machine of GitHub.
# Every job runs inside a plain ubuntu:XX.04 container on that machine (GitHub has no 20.04 machine any more, and the machine
# itself has many packages installed that a plain Ubuntu does not: they would change what Qt is built with).
# The ARM machines of GitHub are free only for public repositories.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version of the programs and of the package (empty = the one in CMakeLists.txt)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  Setup:
    name: GstPipeStudio Setup and Tests on Ubuntu ${{ matrix.ubuntu }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120   # Qt is built from its source in every job; the first run shows how long that takes
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        ubuntu: ['20.04', '22.04', '24.04']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - ubuntu: '20.04'
            container: ubuntu:20.04
          - ubuntu: '22.04'
            container: ubuntu:22.04
          - ubuntu: '24.04'
            container: ubuntu:24.04
    steps:
      - name: Install Base Dependencies
        run: |
          SUDO=sudo
          [ "$(id -u)" = 0 ] && SUDO=
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: GStreamer Setup
        run: gstpipestudio/scripts/check_gst.sh

      - name: Qt Cache
        uses: actions/cache@v4
        with:
          path: ~/Qt/6.8.3
          key: qt-6.8.3-v2-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}   # v2: Qt is configured with -no-icu, built in a plain container

      - name: Qt Setup
        run: gstpipestudio/scripts/check_qt.sh

      - name: Build Tools Setup
        run: gstpipestudio/scripts/check_build_tools.sh

      - name: Build
        env:
          GPS_VERSION: ${{ inputs.version }}
        run: |
          cmake \
          -S gstpipestudio \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3" \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DGPS_BUNDLE_QT=ON \
          ${GPS_VERSION:+-DGPS_VERSION=$GPS_VERSION}
          cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Install Check
        shell: bash
        run: |
          DESTDIR=/tmp/stage cmake --install build
          P=/tmp/stage/usr/lib/gstpipestudio

          # the files of a package
          for f in bin/gstpipestudio bin/gps-inspect bin/gps-update bin/gps-run bin/qt.conf lib/libQt6Core.so.6 \
                   lib/libQt6Widgets.so.6 plugins/platforms/libqxcb.so plugins/platforms/libqoffscreen.so; do
              test -e "$P/$f" || { echo "missing: $f"; exit 1; }
          done
          for f in gstpipestudio gps-inspect gps-update gps-run; do test -x "/tmp/stage/usr/bin/$f"; done
          ls /tmp/stage/usr/lib/*/gstreamer-1.0/libgstgpsconf.so /tmp/stage/usr/share/applications/gstpipestudio.desktop \
             /tmp/stage/usr/share/doc/gstpipestudio/copyright
          du -sh /tmp/stage

          # the program finds every library, and the Qt it loads is the one of the package
          ldd "$P/bin/gstpipestudio" | tee /tmp/ldd.txt
          if grep "not found" /tmp/ldd.txt; then exit 1; fi   # a "! grep" would not stop the step
          grep -q "libQt6Core.so.6 => $P/bin/../lib/" /tmp/ldd.txt   # ldd writes the RPATH as it is: $ORIGIN/../lib

          # the programs and the plugin work through the links of bin/ and the plugin folder
          /tmp/stage/usr/bin/gps-inspect version
          gst-inspect-1.0 /tmp/stage/usr/lib/*/gstreamer-1.0/libgstgpsconf.so > /dev/null

          # the GUI starts and takes its platform plugin from the package (timeout 124 = still running after 5 seconds)
          rc=0
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 timeout 5 /tmp/stage/usr/bin/gstpipestudio > /tmp/gui.txt 2>&1 || rc=$?
          test "$rc" = 124 || { cat /tmp/gui.txt; exit 1; }
          grep -q "$P/plugins/platforms" /tmp/gui.txt

      - name: Package
        shell: bash
        run: gstpipestudio/scripts/make_deb.sh ${{ matrix.ubuntu }} ${{ matrix.arch }}

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: out/*.deb
          retention-days: 14

  # The .deb on a plain Ubuntu: nothing of the build is there (no Qt, no compiler, no GStreamer tools), so apt has to bring
  # what the package needs, as it will for a user.
  InstallTest:
    name: Install the package on a plain Ubuntu ${{ matrix.ubuntu }} (${{ matrix.arch }})
    needs: Setup
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        ubuntu: ['20.04', '22.04', '24.04']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - ubuntu: '20.04'
            container: ubuntu:20.04
          - ubuntu: '22.04'
            container: ubuntu:22.04
          - ubuntu: '24.04'
            container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: deb

      - name: Install
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/GstPipeStudio-${{ matrix.ubuntu }}-${{ matrix.arch }}.deb

      - name: Check
        shell: bash
        run: |
          dpkg -s gstpipestudio | grep -E "^(Package|Version|Depends):"
          command -v gstpipestudio gps-inspect gps-update gps-run
          gps-inspect version
          gst-inspect-1.0 gpsconf > /dev/null

          # every library is found, and the Qt is the one that the package carries
          ldd /usr/lib/gstpipestudio/bin/gstpipestudio | tee /tmp/ldd.txt
          if grep "not found" /tmp/ldd.txt; then exit 1; fi
          grep -q "libQt6Core.so.6 => /usr/lib/gstpipestudio/bin/../lib/" /tmp/ldd.txt

          # the GUI starts (timeout 124 = still running after 5 seconds)
          rc=0
          QT_QPA_PLATFORM=offscreen timeout 5 gstpipestudio > /tmp/gui.txt 2>&1 || rc=$?
          test "$rc" = 124 || { cat /tmp/gui.txt; exit 1; }
