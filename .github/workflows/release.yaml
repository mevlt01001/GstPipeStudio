name: Release

# Builds the six packages (3 Ubuntu versions x 2 architectures), publishes GitHub Release,
# and pushes runnable application and dev Docker images to GitHub Container Registry (GHCR).
# Manual release only, after maintainer review and merge to main.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release highlights (Markdown): features, fixes and known limitations"
        type: string
        required: true
      bump:
        description: "What changed? major = a.0.0, minor = 0.a.0 (new feature), patch = 0.0.a (fix)"
        type: choice
        options: [patch, minor, major]
        default: patch
      draft:
        description: "Only a draft: nobody sees it until you press Publish on the release page"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: release

jobs:
  Version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags are how the last version is found

      - name: Next Version
        id: next
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ inputs.bump || 'patch' }}

  Build:
    needs: Version
    uses: ./.github/workflows/build-linux-20-22-24-aarch64-x86_64.yaml
    with:
      version: ${{ needs.Version.outputs.version }}

  Publish:
    needs: [Version, Build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: deb

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.Version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GstPipeStudio ${{ needs.Version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ startsWith(needs.Version.outputs.version, '0.') }}   # below 1.0.0 the tool is not finished
          generate_release_notes: true
          files: |
            deb/*.deb
            deb/*.sha256
          fail_on_unmatched_files: true
          body: |
            ${{ inputs.release_notes }}

            GstPipeStudio builds GStreamer and DeepStream pipelines by clicking, saves them as a `.conf` file, and runs them
            with `gps-run` or as an element inside `gst-launch`.

            ## Install

            Download the file that matches your Ubuntu version and your processor, then:

            ```bash
            sudo apt install ./GstPipeStudio-22.04-x86_64.deb
            ```

            | Ubuntu | PC (x86_64) | Jetson, ARM (aarch64) |
            |---|---|---|
            | 20.04 | `GstPipeStudio-20.04-x86_64.deb` | `GstPipeStudio-20.04-aarch64.deb` |
            | 22.04 | `GstPipeStudio-22.04-x86_64.deb` | `GstPipeStudio-22.04-aarch64.deb` |
            | 24.04 | `GstPipeStudio-24.04-x86_64.deb` | `GstPipeStudio-24.04-aarch64.deb` |

            Use `apt install ./file.deb`, not `dpkg -i`: apt also installs the GStreamer packages that the tool needs.
            Qt is inside the package, so nothing is built or downloaded on your machine. Start it with `gstpipestudio`.

            Only the basic GStreamer plugins come with it. For more elements install the sets you need:
            `sudo apt install gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav`.

            Every package was installed on a plain Ubuntu of its own version and started there before this release was made.
            The ARM packages were tested on ARM machines of GitHub, not yet on Jetson hardware; DeepStream and GPU
            elements were not tested.

            ## Docker (GitHub Packages)

            You can also run GstPipeStudio directly via Docker without installing anything:

            ```bash
            docker run -it --rm --net=host -e DISPLAY=$DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix ghcr.io/${{ github.repository }}:latest
            ```

  Docker:
    needs: [Version, Build, Publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: deb-22.04-x86_64
          path: out

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Runtime Container
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.Version.outputs.version }}"
          docker build \
            --build-arg DEB_FILE=out/GstPipeStudio-22.04-x86_64.deb \
            -t "${IMAGE_LOWER}:latest" \
            -t "${IMAGE_LOWER}:${VERSION}" \
            -f docker/Dockerfile.runtime .
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${VERSION}"

      - name: Build and Push Dev Container
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}-dev" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.Version.outputs.version }}"
          docker build \
            -t "${IMAGE_LOWER}:latest" \
            -t "${IMAGE_LOWER}:${VERSION}" \
            -f docker/Dockerfile .
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${VERSION}"
