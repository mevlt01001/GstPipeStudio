name: Release

# Builds the six packages (3 Ubuntu versions x 2 architectures), publishes GitHub Release,
# and pushes runnable application and dev Docker images to GitHub Container Registry (GHCR).
# Manual release only, after maintainer review and merge to main.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release highlights (Markdown, at least 80 characters): features, fixes and limitations"
        type: string
        required: true
      bump:
        description: "What changed? major = a.0.0, minor = 0.a.0 (new feature), patch = 0.0.a (fix)"
        type: choice
        options: [patch, minor, major]
        default: patch
      draft:
        description: "Only a draft: nobody sees it until you press Publish on the release page"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: release

jobs:
  Version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags are how the last version is found

      - name: Check release summary
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PYCODE'
          import os
          notes = os.environ['RELEASE_NOTES'].strip()
          if len(notes) < 80:
              raise SystemExit('Write useful release highlights (at least 80 characters). Start from docs/releases/next.md.')
          PYCODE

      - name: Next Version
        id: next
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ inputs.bump || 'patch' }}

  Build:
    needs: Version
    uses: ./.github/workflows/build-linux-20-22-24-aarch64-x86_64.yaml
    with:
      version: ${{ needs.Version.outputs.version }}

  Publish:
    needs: [Version, Build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: deb

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.Version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GstPipeStudio ${{ needs.Version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ startsWith(needs.Version.outputs.version, '0.') }}   # below 1.0.0 the tool is not finished
          generate_release_notes: true
          files: |
            deb/*.deb
            deb/*.sha256
          fail_on_unmatched_files: true
          body: |
            ${{ inputs.release_notes }}

            ## Try it
            Download the `.deb` matching your Ubuntu version (20.04 / 22.04 / 24.04) and CPU (`x86_64` / `aarch64`), then run `sudo apt install ./downloaded-file.deb`.
            Qt is bundled; GStreamer plugins for your devices may need separate installation.

            [Installation, checksums and Docker guide](https://github.com/${{ github.repository }}/blob/main/docs/install.md) · [Hardware-free examples](https://github.com/${{ github.repository }}/tree/main/examples/monitoring) · [Report a problem](https://github.com/${{ github.repository }}/issues)

            **Early development:** ARM packaging checks do not establish Jetson, DeepStream or camera compatibility. Please share device-specific results.
            Runtime Docker images are published after a non-draft release job succeeds; the default image is Ubuntu 22.04 / amd64. See the guide for image tags and desktop access.

  Docker:
    if: ${{ !inputs.draft }}
    needs: [Version, Build, Publish]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '22.04', '24.04']
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.ubuntu }}-x86_64
          path: out
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke test and publish runtime image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.Version.outputs.version }}
          UBUNTU: ${{ matrix.ubuntu }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker build --build-arg UBUNTU="$UBUNTU" \
            --build-arg DEB_FILE="out/GstPipeStudio-${UBUNTU}-x86_64.deb" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            -t gps-runtime-check -f docker/Dockerfile.runtime .
          docker run --rm -e QT_QPA_PLATFORM=offscreen gps-runtime-check --version
          docker run --rm --entrypoint gps-inspect gps-runtime-check version
          # A live test source intentionally ends by timeout (gps-run exit 1).
          docker run --rm --entrypoint gps-run gps-runtime-check /usr/share/gstpipestudio/examples/01-live-baseline.conf --timeout-ms 500 > smoke.json || test "$?" -eq 1
          python3 -c 'import json; assert json.load(open("smoke.json"))["status"] == "timeout"'
          docker tag gps-runtime-check "$IMAGE:$VERSION-ubuntu$UBUNTU"
          docker tag gps-runtime-check "$IMAGE:ubuntu$UBUNTU"
          docker push "$IMAGE:$VERSION-ubuntu$UBUNTU"
          docker push "$IMAGE:ubuntu$UBUNTU"
          if [ "$UBUNTU" = '22.04' ]; then
            docker tag gps-runtime-check "$IMAGE:$VERSION"
            docker tag gps-runtime-check "$IMAGE:latest"
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"
          fi

  DevDocker:
    if: ${{ !inputs.draft }}
    needs: [Version, Build, Publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish development environment (Ubuntu 22.04 / amd64)
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.Version.outputs.version }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}-dev"
          docker build --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" -t "$IMAGE:$VERSION" -f docker/Dockerfile .
          docker run --rm "$IMAGE:$VERSION" bash -lc 'cmake --version && gst-inspect-1.0 --version'
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
