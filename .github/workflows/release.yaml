name: Release

# Makes a release by hand: Actions tab, Release, Run workflow, and choose what kind of change this is. The number is not typed
# in; it is the last release tag plus the step that you choose (the first release, with no tag yet, starts from 0.0.0):
#   major  a.0.0  a big change, a new version of the whole (1.0.0 is the day the tool is fully working)
#   minor  0.a.0  a new feature
#   patch  0.0.a  a fix
# Then the six packages (3 Ubuntu versions x 2 architectures) are built and tested on a plain Ubuntu by the build workflow,
# and only if all of them pass, the tag and the release are made with the six .deb files and the notes that GitHub writes
# from the changes since the last release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "What changed? major = a.0.0, minor = 0.a.0 (new feature), patch = 0.0.a (fix)"
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency: release

jobs:
  Version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags are how the last version is found

      - name: Next Version
        id: next
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ inputs.bump }}

  Build:
    needs: Version
    uses: ./.github/workflows/build-linux-20-22-24-aarch64-x86_64.yaml
    with:
      version: ${{ needs.Version.outputs.version }}

  Publish:
    needs: [Version, Build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: deb

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.Version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GstPipeStudio ${{ needs.Version.outputs.version }}
          prerelease: ${{ startsWith(needs.Version.outputs.version, '0.') }}   # below 1.0.0 the tool is not finished
          generate_release_notes: true
          files: deb/*.deb
          fail_on_unmatched_files: true
          body: |
            GstPipeStudio builds GStreamer and DeepStream pipelines by clicking, saves them as a `.conf` file, and runs them
            with `gps-run` or as an element inside `gst-launch`.

            ## Install

            Download the file that matches your Ubuntu version and your processor, then:

            ```bash
            sudo apt install ./GstPipeStudio-22.04-x86_64.deb
            ```

            | Ubuntu | PC (x86_64) | Jetson, ARM (aarch64) |
            |---|---|---|
            | 20.04 | `GstPipeStudio-20.04-x86_64.deb` | `GstPipeStudio-20.04-aarch64.deb` |
            | 22.04 | `GstPipeStudio-22.04-x86_64.deb` | `GstPipeStudio-22.04-aarch64.deb` |
            | 24.04 | `GstPipeStudio-24.04-x86_64.deb` | `GstPipeStudio-24.04-aarch64.deb` |

            Use `apt install ./file.deb`, not `dpkg -i`: apt also installs the GStreamer packages that the tool needs.
            Qt is inside the package, so nothing is built or downloaded on your machine. Start it with `gstpipestudio`.

            Every package was installed on a plain Ubuntu of its own version and started there before this release was made.
            The ARM packages were tested on ARM machines of GitHub, not yet on Jetson hardware; DeepStream and GPU
            elements were not tested.
