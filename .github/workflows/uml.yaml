name: Generate UML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'gstpipestudio/core/**'
      - 'gstpipestudio/app/**'
      - '.clang-uml'
  workflow_dispatch:

jobs:
  uml:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dependencies
        run: |
          ./gstpipestudio/scripts/check_gst.sh
          ./gstpipestudio/scripts/check_qt.sh
          ./gstpipestudio/scripts/check_build_tools.sh
      - name: Generate UML
        run: |
          export CMAKE_PREFIX_PATH="$HOME/Qt/6.8.3"
          ./gstpipestudio/scripts/generate_uml.sh "$RUNNER_TEMP/build"
      - name: Upload UML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: docs/uml/

