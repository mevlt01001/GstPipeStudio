name: Generate UML Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'gstpipestudio/core/**'
      - 'gstpipestudio/app/**'
      - '.clang-uml'
  workflow_dispatch:

jobs:
  uml:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    permissions:
      contents: write
    steps:
      - name: Install Base Dependencies
        run: |
          apt-get update
          env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates software-properties-common curl build-essential cmake ninja-build \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev qt6-base-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate UML
        run: |
          ./gstpipestudio/scripts/generate_uml.sh "$RUNNER_TEMP/build"

      - name: Commit and Push UML Diagrams
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gstpipestudio/docs/uml/
          if ! git diff --staged --quiet; then
            git commit -m "docs(uml): update UML diagrams [skip ci]"
            git push
          fi

      - name: Upload UML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: gstpipestudio/docs/uml/

