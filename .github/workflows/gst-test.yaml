name: GStreamer test

# Runs scripts/check_gst.sh on Ubuntu 20.04, 22.04 and 24.04, on x86_64 and on aarch64 (also called arm64): the script installs
# GStreamer when it is missing, and the test passes when the installed version is 1.16 or newer. It runs when the script or its
# test change, and by hand.
#
# Six jobs start at the same time (3 Ubuntu versions x 2 architectures), each on its own fresh Ubuntu 24.04 machine of GitHub.
# Per architecture:
#   24.04  the test runs on the machine itself
#   22.04  the test runs inside a plain ubuntu:22.04 container on that machine
#   20.04  the test runs inside a plain ubuntu:20.04 container (GitHub has no 20.04 machine any more)
# The ARM machines of GitHub are free only for public repositories.
on:
  push:
    branches: [main]
    paths:
      - gstpipestudio/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Setup:
    name: GstPipeStudio Setup and Tests on Ubuntu ${{ matrix.ubuntu }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        ubuntu: ['20.04', '22.04', '24.04']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - ubuntu: '20.04'
            container: ubuntu:20.04
          - ubuntu: '22.04'
            container: ubuntu:22.04
    steps:
      - name: Install Base Dependencies
        run: |
          SUDO=sudo
          [ "$(id -u)" = 0 ] && SUDO=
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: GStremer Setup
        run: gstpipestudio/scripts/check_gst.sh
      - name: Qt Setup
        run: gstpipestudio/scripts/check_qt.sh

      - name: Build Tools Setup
        run: gstpipestudio/scripts/check_build_tools.sh

      - name: Build
        run: |
          cmake -S gstpipestudio -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(echo "$HOME"/Qt/6.8.3/gcc_*)"
          cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure
