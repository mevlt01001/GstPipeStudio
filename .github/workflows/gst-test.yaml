name: GStreamer test

# Builds and tests GstPipeStudio on Ubuntu 20.04, 22.04 and 24.04, on x86_64 and on aarch64 (also called arm64), from a plain
# Ubuntu with nothing installed. The steps of every job, in this order; a step that fails stops the job:
#   GStreamer Setup    scripts/check_gst.sh          GStreamer 1.16 or newer (installed with apt when missing)
#   Qt Setup           scripts/check_qt.sh           Qt 6.8.3, built from its source into ~/Qt/6.8.3
#   Build Tools Setup  scripts/check_build_tools.sh  compiler, CMake, Ninja
#   Build, Test        CMake and ctest
# It runs when anything in gstpipestudio/ changes, on pull requests, and by hand.
#
# Six jobs start at the same time (3 Ubuntu versions x 2 architectures), each on its own fresh Ubuntu 24.04 machine of GitHub.
# Per architecture:
#   24.04  the steps run on the machine itself
#   22.04  the steps run inside a plain ubuntu:22.04 container on that machine
#   20.04  the steps run inside a plain ubuntu:20.04 container (GitHub has no 20.04 machine any more)
# The ARM machines of GitHub are free only for public repositories.
on:
  push:
    branches: [main]
    paths:
      - gstpipestudio/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Setup:
    name: GstPipeStudio Setup and Tests on Ubuntu ${{ matrix.ubuntu }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120   # Qt is built from its source in every job; the first run shows how long that takes
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        ubuntu: ['20.04', '22.04', '24.04']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - ubuntu: '20.04'
            container: ubuntu:20.04
          - ubuntu: '22.04'
            container: ubuntu:22.04
    steps:
      - name: Install Base Dependencies
        run: |
          SUDO=sudo
          [ "$(id -u)" = 0 ] && SUDO=
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: GStreamer Setup
        run: gstpipestudio/scripts/check_gst.sh

      - name: Qt Setup
        run: gstpipestudio/scripts/check_qt.sh

      - name: Build Tools Setup
        run: gstpipestudio/scripts/check_build_tools.sh

      - name: Build
        run: |
          cmake -S gstpipestudio -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3"
          cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure
