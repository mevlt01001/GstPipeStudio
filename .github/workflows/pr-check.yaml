name: PR Fast Check

# Quick validation for Pull Requests: tests on a single target (Ubuntu 22.04 x86_64)
# in ~2 minutes rather than running all 6 matrix targets and slow ARM emulation.
on:
  push:
    branches: [main, dev-zero]
  workflow_dispatch:
  pull_request:
    paths:
      - gstpipestudio/**
      - .github/workflows/**
      - docs/**
      - README.md
      - CONTRIBUTING.md
      - docker/**
      - .dockerignore

permissions:
  contents: read

jobs:
  Check:
    name: Fast Check on Ubuntu 22.04 (x86_64)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install Base Dependencies
        run: |
          apt-get update
          env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: GStreamer Setup
        run: gstpipestudio/scripts/check_gst.sh

      - name: Qt Cache
        uses: actions/cache@v4
        with:
          path: ~/Qt/6.8.3
          key: qt-6.8.3-v2-ubuntu22.04-x86_64

      - name: Qt Setup
        run: gstpipestudio/scripts/check_qt.sh

      - name: Build Tools Setup
        run: gstpipestudio/scripts/check_build_tools.sh

      - name: Build
        run: |
          cmake \
          -S gstpipestudio \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3" \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DGPS_BUNDLE_QT=ON
          cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Stage install
        run: DESTDIR=/tmp/stage cmake --install build

      - name: Package Check
        run: gstpipestudio/scripts/make_deb.sh 22.04 x86_64


      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-zero-review
          path: |
            out/*.deb
            out/*.sha256
            build/report/
            build/Testing/Temporary/LastTest.log
