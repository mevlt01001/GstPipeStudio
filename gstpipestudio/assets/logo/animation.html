(function () {

     on tidy right-angled routes. */
  var GHOST_NODES = [

    ["infer", "nvinfer", 0.77, 0.60], ["app", "appsink", 0.945, 0.74], ["rtsp", "rtspsrc", 0.07, 0.88], ["depay", "rtph264depay", 0.245, 0.92],
    ["dec2", "nvv4l2decoder", 0.42, 0.90]
  ];
  var GHOST_EDGES = [["cam", "conv"], ["conv", "tee"], ["tee", "q1"], ["tee", "q2"], ["q1", "enc"], ["enc", "file"], ["q2", "mix"],
    ["src", "parse"], ["parse", "dec1"], ["dec1", "mux"], ["mux", "infer"], ["infer", "app"], ["infer", "mix"],

  var BOX_W = 92, BOX_H = 32, CORNER = 8, STUB = 14, GHOST_OPACITY = 0.2, FLOW_MS = 600;

  var world = document.getElementById("rWorld");
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);

  function clamp(v) { return Math.max(0, Math.min(1, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function glyph(points) {

    el("circle", { cx: 100, cy: 78, r: 12, fill: GREEN }, inner);
    var shape = el("polygon", { points: pts(points), fill: GREEN, stroke: GREEN, "stroke-width": 5, "stroke-linejoin": "round" }, inner);
    return { g: g, shape: shape, inner: inner };
  }
  function pts(list) { return list.map(function (p) { return p[0] + "," + p[1]; }).join(" "); }

  var ripple = el("circle", { fill: "none", stroke: GREEN, "stroke-width": 4 });
  var echo = el("circle", { fill: "none", stroke: GREEN, "stroke-width": 2.5 });

  function layout() {

      el("circle", { cx: x - BOX_W / 2, cy: y, r: 4, fill: WHITE }, box);

  /* Right-angled routes that always end exactly on both pads. With room: right, up or down, right. When the boxes

    var mid = (x1 + x2) / 2, ym = (y1 + y2) / 2;
    if (x2 - x1 >= 2 * STUB) return rounded([[x1, y1], [mid, y1], [mid, y2], [x2, y2]]);
    return rounded([[x1, y1], [x1 + STUB, y1], [x1 + STUB, ym], [x2 - STUB, ym], [x2 - STUB, y2], [x2, y2]]);
  }
  /* a polyline whose corners are rounded, never by more than half of the shorter side */
  function rounded(p) {
    function toward(a, b, r) { var d = Math.hypot(b[0] - a[0], b[1] - a[1]); return [a[0] + (b[0] - a[0]) * r / d, a[1] + (b[1] - a[1]) * r / d]; }
    var d = "M" + p[0][0] + " " + p[0][1];
    for (var i = 1; i < p.length - 1; i++) {
      var a = p[i - 1], b = p[i], c = p[i + 1];
      var r = Math.min(CORNER, Math.hypot(b[0] - a[0], b[1] - a[1]) / 2, Math.hypot(c[0] - b[0], c[1] - b[1]) / 2);
      if (r < 0.5) { d += " L" + b[0] + " " + b[1]; continue; }
      var s = toward(b, a, r), e = toward(b, c, r);
      d += " L" + s[0] + " " + s[1] + " Q" + b[0] + " " + b[1] + " " + e[0] + " " + e[1];
    }
    var last = p[p.length - 1];
    return d + " L" + last[0] + " " + last[1];
  }

  /* The picture is framed between the left edge of the first ring and the right edge of the moving ring,
     so both side margins stay equal. It starts close up on the first ring and pulls back as the word grows. */
  function frame(mx, moverScale) {
    var left = gc.x - 50 * G_SCALE, right = mx + 52 * moverScale;
    var z = Math.min(MAX_ZOOM, (W - 2 * MARGIN) / (right - left));
    world.setAttribute("transform", "translate(" + W / 2 + " " + H / 2 + ") scale(" + z + ") translate(" + -(left + right) / 2 + " " + -gc.y + ")");
  }

  function draw(t) {
    var p = clamp((t - T_START) / T_FLY), n = slots.length;
    /* click on the first ring */
    var c = clamp((t - T_IDLE) / T_CLICK), press = 1 - 0.09 * Math.sin(Math.PI * c);
    first.g.setAttribute("transform", "translate(" + gc.x + " " + gc.y + ") scale(" + G_SCALE * press + ")");
    var rp = clamp((t - T_IDLE) / 500);
    ripple.setAttribute("cx", gc.x); ripple.setAttribute("cy", gc.y);
    ripple.setAttribute("r", 46 + 90 * rp);
    ripple.setAttribute("opacity", t < T_IDLE ? 0 : 0.8 * (1 - rp));
    /* a copy leaves the ring and turns from play into stop */
    var m = ease(clamp((t - T_IDLE - 200) / 500));
    mover.shape.setAttribute("points", pts(TRI.map(function (a, i) { return [lerp(a[0], SQ[i][0], m), lerp(a[1], SQ[i][1], m)]; })));
    /* straight left to right */
    var e = ease(p), last = slots[n - 1];
    var mx = lerp(gc.x, last.x, e), my = lerp(gc.y, last.y, e);
    var moverScale = lerp(G_SCALE, O_SCALE, e);
    mover.g.setAttribute("opacity", t < T_IDLE + 150 ? 0 : 1);
    /* landing: a small settle on the last letter, and a quiet echo of the first click */
    var q = clamp((t - T_LAND) / 450), settle = 1 + 0.1 * Math.sin(Math.PI * q) * (1 - q);
    mover.g.setAttribute("transform", "translate(" + mx + " " + my + ") scale(" + moverScale * settle + ")");
    frame(mx, moverScale);
    var er = clamp((t - T_LAND) / 700);
    echo.setAttribute("cx", last.x); echo.setAttribute("cy", last.y);
    echo.setAttribute("r", 32 + 60 * ease(er));
    echo.setAttribute("opacity", t < T_LAND ? 0 : 0.6 * (1 - er));
    /* the flow starts with the click and dies out as the ring lands, leaving the plain final o */
    flow.setAttribute("opacity", clamp((t - T_IDLE - 150) / 250) * (1 - ease(clamp((t - T_LAND) / 350))));
    flow.setAttribute("stroke-dashoffset", -t / FLOW_MS);
    /* a soft light travels with the ring and goes out when it lands */
    glow.setAttribute("cx", mx); glow.setAttribute("cy", my);
    glow.setAttribute("opacity", t < T_IDLE + 150 ? 0 : 0.5 * (1 - ease(clamp((t - T_LAND) / 600))));
    /* faint elements link up as the ring passes them, and all go out once it lands */
    var fade = 1 - ease(clamp((t - T_LAND) / 500));
    ghostBoxes.forEach(function (b) {
      b.node.setAttribute("opacity", GHOST_OPACITY * fade * ease(clamp((mx - b.at) / 80)));
    });
    ghostLinks.forEach(function (l) {
      l.node.setAttribute("stroke-dashoffset", 1 - clamp((mx - l.from) / (l.to - l.from)));
      l.node.setAttribute("opacity", GHOST_OPACITY * fade);
    });
    /* each letter rises softly into place just behind the ring */
    for (var i = 0; i < WORD.length; i++) {
      var pop = ease(clamp((mx - slots[i].x) / Math.min(70, last.x - slots[i].x)));  /* the last letters must finish before the ring stops */
      letters[i].setAttribute("opacity", pop);
      letters[i].setAttribute("transform", "translate(" + slots[i].x + " " + 10 * (1 - pop) + ")");
    }
  }

  function tick(now) {
    if (startTime === undefined) startTime = now;
    var t = now - startTime;
    draw(Math.min(t, T_END));
    if (t < T_END) raf = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(raf);
    startTime = undefined;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(T_END); return; }
    raf = requestAnimationFrame(tick);
  }
  document.getElementById("replay").addEventListener("click", play);
  function begin() {
    layout();
    var at = /[?&]t=(\d+)/.exec(location.search);
    if (at) { document.getElementById("replay").hidden = true; draw(Math.min(+at[1], T_END)); document.title = "ready"; return; }
    play();
  }
  var fonts = document.fonts && document.fonts.load ? document.fonts.load('600 100px Outfit') : Promise.resolve();
  fonts.then(begin, begin);
})();
</script>
</body>
</html>
