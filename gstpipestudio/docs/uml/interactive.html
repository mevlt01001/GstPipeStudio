<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GstPipeStudio UML Interactive Architecture Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button, input {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--surface-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    select:hover, button:hover, input:hover {
      border-color: var(--primary);
    }

    button:active {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-group {
      display: flex;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      overflow: hidden;
    }

    .btn-group button {
      border: none;
      border-radius: 0;
      border-right: 1px solid var(--surface-border);
      padding: 6px 10px;
    }

    .btn-group button:last-child {
      border-right: none;
    }

    #search-box {
      width: 180px;
      user-select: text;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
      display: inline-block;
    }

    #viewport svg {
      display: block;
      max-width: none;
      max-height: none;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
    }

    /* Highlight class for search */
    .highlight rect, .highlight polygon, .highlight path {
      stroke: #f59e0b !important;
      stroke-width: 4px !important;
      filter: drop-shadow(0 0 10px #f59e0b);
    }

    #status-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 5;
      pointer-events: none;
    }

    #info-card {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 14px 18px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 5;
      display: none;
    }

    #info-card h3 {
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 6px;
      word-break: break-all;
    }

    #info-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    #info-card button.close-btn {
      float: right;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
    }
    #info-card button.close-btn:hover {
      color: var(--text);
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-muted);
      z-index: 20;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>GstPipeStudio Architecture</h1>
      <span class="badge" id="diagram-level-badge">Level 1: Big Picture</span>
    </div>

    <div class="controls">
      <label for="diagram-select" style="font-size: 12px; color: var(--text-muted);">View:</label>
      <select id="diagram-select">
        <optgroup label="High-Level (Relationships Only)">
          <option value="core_overview.svg" data-level="Core — Classes & Relationships" selected>Core: Overview</option>
          <option value="app_overview.svg" data-level="App / UI — Classes & Relationships">App / UI: Overview</option>
          <option value="architecture_overview.svg" data-level="Package & Directory Architecture">Package Architecture</option>
        </optgroup>
        <optgroup label="Zoom-In (Members & Methods)">
          <option value="core_detailed.svg" data-level="Core — Detailed (Members & Methods)">Core: Detailed</option>
          <option value="app_detailed.svg" data-level="App / UI — Detailed (Members & Methods)">App / UI: Detailed</option>
        </optgroup>
      </select>

      <input type="text" id="search-box" placeholder="Search class... (e.g. Element)" />

      <div class="btn-group">
        <button id="btn-zoom-in" title="Zoom In (+)">＋</button>
        <button id="btn-zoom-out" title="Zoom Out (-)">－</button>
        <button id="btn-reset" title="Reset View (100%)">100%</button>
        <button id="btn-fit" title="Fit to Screen">⛶ Fit</button>
      </div>

      <button id="btn-fullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>

  <div id="canvas-container">
    <div class="loading-overlay" id="loading-overlay">Loading diagram...</div>
    <div id="viewport"></div>
  </div>

  <div id="status-bar">
    <span id="zoom-text">Zoom: 100%</span> | <span id="hint-text">Scroll to zoom, drag to pan. Click any class for details.</span>
  </div>

  <div id="info-card">
    <button class="close-btn" onclick="document.getElementById('info-card').style.display='none'">✕</button>
    <h3 id="card-title">Class Name</h3>
    <p id="card-desc">Details loading...</p>
    <a id="card-link" href="#" target="_blank" style="color: var(--primary); font-size: 12px; text-decoration: none;">Search in Repo Code →</a>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const viewport = document.getElementById('viewport');
    const select = document.getElementById('diagram-select');
    const badge = document.getElementById('diagram-level-badge');
    const zoomText = document.getElementById('zoom-text');
    const loadingOverlay = document.getElementById('loading-overlay');
    const searchBox = document.getElementById('search-box');

    let scale = 1;
    let translateX = 50;
    let translateY = 50;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      zoomText.innerText = `Zoom: ${Math.round(scale * 100)}%`;
    }

    async function loadDiagram(filename) {
      loadingOverlay.style.display = 'flex';
      badge.innerText = select.options[select.selectedIndex].getAttribute('data-level');
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error("Failed to load: " + filename);
        const svgText = await response.text();
        viewport.innerHTML = svgText;
        
        // Setup interactive node clicks
        setupNodeInteractivity();
        
        // Auto-fit
        fitToScreen();
      } catch (err) {
        viewport.innerHTML = `<div style="padding: 40px; color: #ef4444;"><h3>Failed to load diagram</h3><p>${err.message}</p></div>`;
      } finally {
        loadingOverlay.style.display = 'none';
      }
    }

    function setupNodeInteractivity() {
      const svg = viewport.querySelector('svg');
      if (!svg) return;
      
      // Plantuml SVG node groups
      const nodes = svg.querySelectorAll('g.node, g[id^="elem_"]');
      nodes.forEach(node => {
        node.style.cursor = 'pointer';
        node.addEventListener('click', (e) => {
          e.stopPropagation();
          const textEl = node.querySelector('text');
          const name = textEl ? textEl.textContent.trim() : 'Component';
          showInfoCard(name);
        });
      });
    }

    function showInfoCard(className) {
      const card = document.getElementById('info-card');
      const title = document.getElementById('card-title');
      const desc = document.getElementById('card-desc');
      const link = document.getElementById('card-link');

      title.textContent = className;
      desc.textContent = `Component '${className}' in GstPipeStudio architecture.`;
      
      link.href = `https://github.com/search?q=repo%3APipelineStudioGUI+${encodeURIComponent(className)}&type=code`;
      
      card.style.display = 'block';
    }

    function fitToScreen() {
      const svg = viewport.querySelector('svg');
      if (!svg) return;

      const rect = svg.getBoundingClientRect();
      const cWidth = container.clientWidth - 80;
      const cHeight = container.clientHeight - 80;

      const baseWidth = svg.viewBox?.baseVal?.width || rect.width || 800;
      const baseHeight = svg.viewBox?.baseVal?.height || rect.height || 600;

      const scaleX = cWidth / baseWidth;
      const scaleY = cHeight / baseHeight;
      scale = Math.min(scaleX, scaleY, 1.2);
      if (scale < 0.2) scale = 0.2;

      translateX = (container.clientWidth - baseWidth * scale) / 2;
      translateY = (container.clientHeight - baseHeight * scale) / 2;
      updateTransform();
    }

    // Zoom Controls
    document.getElementById('btn-zoom-in').onclick = () => {
      scale = Math.min(scale * 1.25, 5);
      updateTransform();
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      scale = Math.max(scale / 1.25, 0.1);
      updateTransform();
    };

    document.getElementById('btn-reset').onclick = () => {
      scale = 1;
      translateX = 50;
      translateY = 50;
      updateTransform();
    };

    document.getElementById('btn-fit').onclick = fitToScreen;

    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    // Pan & Drag
    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Wheel Zoom toward mouse position
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
      const mouseX = e.clientX - container.offsetLeft;
      const mouseY = e.clientY - container.offsetTop;

      const newScale = Math.min(Math.max(scale * zoomFactor, 0.1), 5);
      
      translateX = mouseX - (mouseX - translateX) * (newScale / scale);
      translateY = mouseY - (mouseY - translateY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }, { passive: false });

    // Search filter
    searchBox.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      const svg = viewport.querySelector('svg');
      if (!svg) return;

      const textNodes = svg.querySelectorAll('text');
      textNodes.forEach(t => {
        const parent = t.closest('g.node') || t.closest('g[id^="elem_"]');
        if (parent) {
          if (term && t.textContent.toLowerCase().includes(term)) {
            parent.classList.add('highlight');
          } else {
            parent.classList.remove('highlight');
          }
        }
      });
    });

    // Dropdown change
    select.addEventListener('change', (e) => {
      loadDiagram(e.target.value);
    });

    // Initial load
    loadDiagram(select.value);
  </script>
</body>
</html>
