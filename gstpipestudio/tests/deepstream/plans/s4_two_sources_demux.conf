[gstpipestudio]
version=1
name=s4_two_sources_demux
complete=1

[element:videotestsrc_1]
factory=videotestsrc
prop.num-buffers=60
prop.pattern=smpte
x=40
y=40

[element:videotestsrc_2]
factory=videotestsrc
prop.num-buffers=60
prop.pattern=ball
x=40
y=240

[element:nvvideoconvert_1]
factory=nvvideoconvert
x=240
y=40

[element:nvvideoconvert_2]
factory=nvvideoconvert
x=240
y=240

[element:nvstreammux_1]
factory=nvstreammux
prop.batch-size=2
prop.width=640
prop.height=480
prop.batched-push-timeout=40000
x=440
y=140

[element:nvstreamdemux_1]
factory=nvstreamdemux
request.src_%u=1
x=640
y=140

[element:queue_1]
factory=queue
x=840
y=40

[element:fakesink_1]
factory=fakesink
prop.sync=0
x=1040
y=40

[link:0]
src=videotestsrc_1
srcpad=src
sink=nvvideoconvert_1
sinkpad=sink
caps=video/x-raw, format=(string)I420, width=(int)640, height=(int)480

[link:1]
src=videotestsrc_2
srcpad=src
sink=nvvideoconvert_2
sinkpad=sink
caps=video/x-raw, format=(string)I420, width=(int)640, height=(int)480

[link:2]
src=nvvideoconvert_1
srcpad=src
sink=nvstreammux_1
sinkpad=sink_%u

[link:3]
src=nvvideoconvert_2
srcpad=src
sink=nvstreammux_1
sinkpad=sink_%u

[link:4]
src=nvstreammux_1
srcpad=src
sink=nvstreamdemux_1
sinkpad=sink

[link:5]
src=nvstreamdemux_1
srcpad=src_%u#0
sink=queue_1
sinkpad=sink

[link:6]
src=queue_1
srcpad=src
sink=fakesink_1
sinkpad=sink
