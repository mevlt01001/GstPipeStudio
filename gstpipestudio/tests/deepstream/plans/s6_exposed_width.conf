[gstpipestudio]
version=1
name=s6_exposed_width
complete=1

[element:videotestsrc_1]
factory=videotestsrc
prop.num-buffers=60
prop.is-live=0
x=40
y=40

[element:nvvideoconvert_1]
factory=nvvideoconvert
x=240
y=40

[element:nvstreammux_1]
factory=nvstreammux
prop.batch-size=1
prop.width=640
prop.height=480
prop.batched-push-timeout=40000
x=440
y=40

[element:nvmultistreamtiler_1]
factory=nvmultistreamtiler
prop.rows=1
prop.columns=1
prop.width=640
prop.height=480
x=640
y=40

[element:nvvideoconvert_2]
factory=nvvideoconvert
x=840
y=40

[element:nvdsosd_1]
factory=nvdsosd
x=1040
y=40

[element:fakesink_1]
factory=fakesink
prop.sync=0
x=1240
y=40

[link:0]
src=videotestsrc_1
srcpad=src
sink=nvvideoconvert_1
sinkpad=sink
caps=video/x-raw, width=(int)640, height=(int)480

[link:1]
src=nvvideoconvert_1
srcpad=src
sink=nvstreammux_1
sinkpad=sink_%u

[link:2]
src=nvstreammux_1
srcpad=src
sink=nvmultistreamtiler_1
sinkpad=sink

[link:3]
src=nvmultistreamtiler_1
srcpad=src
sink=nvvideoconvert_2
sinkpad=sink

[link:4]
src=nvvideoconvert_2
srcpad=src
sink=nvdsosd_1
sinkpad=sink
caps=video/x-raw(memory:NVMM), format=(string)RGBA

[link:5]
src=nvdsosd_1
srcpad=src
sink=fakesink_1
sinkpad=sink

[expose:width]
target=nvstreammux_1.width

[expose:height]
target=nvstreammux_1.height

[expose:frames]
target=videotestsrc_1.num-buffers
